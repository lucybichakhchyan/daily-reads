<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Reads | Lucy Bichakhchyan</title>
<meta name="description" content="The tech, developer and AI headlines I read each day.">
<style>
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900;font-display:swap}
@font-face{font-family:Playfair;src:url(fonts/Playfair.ttf);font-weight:400 900;font-style:normal;font-display:swap}
@font-face{font-family:Playfair;src:url(fonts/Playfair-Italic.ttf);font-weight:400 900;font-style:italic;font-display:swap}
:root{--canvas:#1a1a1a;--text:#f6f6f4;--muted:#b9b9b6;--accent:#8a2be2;--accent-light:#a762e7;--hairline:rgba(246,246,244,.25);--frame:rgba(246,246,244,.6);--radius:2px;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--text);font:400 17px/1.5 Inter,system-ui,sans-serif}
main{max-width:880px;margin:0 auto;padding:clamp(24px,5vw,44px) clamp(20px,5vw,44px) 73px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-bottom:clamp(36px,6vw,56px)}
.top a{color:var(--muted);text-decoration:none}
.top a:hover{color:var(--accent-light)}
.top .brand{display:flex;align-items:center;gap:12px;color:var(--text);font-size:16px;white-space:nowrap}
.brand img{width:36px;height:36px;border-radius:50%;display:block}
.eyebrow{margin:0 0 8px;color:var(--muted);font-size:15px}
h1{font:400 clamp(44px,8vw,72px)/1.05 Playfair,Georgia,serif;letter-spacing:-.02em;margin:0}
h1 em{font-style:italic}
.tabs{display:flex;flex-wrap:wrap;gap:0 clamp(16px,3vw,28px);margin:clamp(24px,4vw,36px) 0 0;border-bottom:1px solid var(--hairline)}
.tab{font:400 16px/1.2 Inter,system-ui,sans-serif;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 2px;min-height:44px;cursor:pointer}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text);font-weight:600;border-bottom-color:var(--accent-light)}
.utility{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;padding:12px 0;color:var(--muted);font-size:14px}
.utility p{margin:0}
ol{list-style:none;margin:0;padding:0}
li{border-bottom:1px solid var(--hairline);padding:22px 0}
li:first-child{padding-top:12px}
.headline{display:block;color:var(--text);text-decoration:none;font-size:clamp(19px,2.3vw,22px);line-height:1.4;font-weight:400;overflow-wrap:anywhere}
.headline:hover,.headline:focus-visible{text-decoration:underline;text-decoration-color:var(--accent-light);text-decoration-thickness:1px;text-underline-offset:4px}
li.read .headline{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 20px;margin-top:10px;color:var(--muted);font-size:14px}
.meta a{color:var(--muted)}
.meta a:hover{color:var(--accent-light)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent-light);outline-offset:3px}
.notice{margin:24px 0;color:var(--muted)}
footer{margin-top:32px;color:var(--muted);font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header class="top">
    <a class="brand" href="https://www.bichakhchyan.com"><img src="images/avatar.png" alt="" width="36" height="36">Lucy Bichakhchyan</a>
    <a href="https://github.com/lucybichakhchyan/daily-reads">GitHub</a>
  </header>
  <p class="eyebrow">( what I'm reading )</p>
  <h1><em>Daily</em> reads</h1>
  <div class="tabs" id="tabs" role="tablist" aria-label="News sources"></div>
  <section id="panel" role="tabpanel" tabindex="-1">
    <div class="utility"><p id="about"></p><p id="updated">Loading the latest headlines.</p></div>
    <ol id="list"></ol>
    <p class="notice" id="notice" hidden></p>
  </section>
  <footer>Headlines and links belong to their publishers. This page updates about once an hour.</footer>
</main>
<script>
const READ_KEY = "daily-reads-opened";
const $ = id => document.getElementById(id);
let data = { tabs: [], sources: [], items: [] }, active = "all";

function readOpened() { try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]")); } catch { return new Set(); } }
const opened = readOpened();
function markOpened(url) {
  opened.add(url);
  try { localStorage.setItem(READ_KEY, JSON.stringify([...opened].slice(-500))); } catch {}
}

function timeAgo(date) {
  if (!date) return "";
  const minutes = Math.max(1, Math.round((Date.now() - new Date(date)) / 60000));
  if (minutes < 60) return `${minutes} min ago`;
  const hours = Math.round(minutes / 60);
  if (hours < 24) return `${hours} hr ago`;
  const days = Math.round(hours / 24);
  return days === 1 ? "Yesterday" : `${days} days ago`;
}

function renderList() {
  const tab = data.tabs.find(item => item.id === active);
  const sources = data.sources.filter(item => active === "all" || item.tab === active);
  const ids = new Set(sources.map(item => item.id));
  const down = sources.filter(item => !item.ok).map(item => item.name);
  $("about").textContent = `${tab ? tab.about : "All sources"} · Newest first`;
  const items = data.items
    .filter(item => ids.has(item.source))
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  $("list").replaceChildren(...items.map(item => {
    const li = document.createElement("li");
    if (opened.has(item.url)) li.className = "read";
    const link = Object.assign(document.createElement("a"), { className: "headline", href: item.url, target: "_blank", rel: "noopener noreferrer", textContent: item.title });
    link.addEventListener("click", () => { markOpened(item.url); li.className = "read"; });
    const meta = Object.assign(document.createElement("p"), { className: "meta" });
    const name = data.sources.find(entry => entry.id === item.source)?.name;
    const credit = item.publisher ? [item.publisher, item.author, `via ${name}`].filter(Boolean).join(" · ") : name;
    const left = Object.assign(document.createElement("span"), { textContent: credit });
    if (item.comments) left.append(" · ", Object.assign(document.createElement("a"), { href: item.comments, target: "_blank", rel: "noopener noreferrer", textContent: "Comments" }));
    meta.append(left, Object.assign(document.createElement("span"), { textContent: timeAgo(item.date) }));
    li.append(link, meta);
    return li;
  }));
  $("notice").hidden = !down.length && items.length > 0;
  $("notice").textContent = down.length ? `Not updated on the last run: ${down.join(", ")}.` : "There are no headlines here yet.";
}

function selectTab(id, focus = false) {
  active = id;
  document.querySelectorAll(".tab").forEach(tab => {
    const selected = tab.dataset.id === id;
    tab.setAttribute("aria-selected", String(selected));
    tab.tabIndex = selected ? 0 : -1;
    if (selected && focus) tab.focus();
  });
  try { history.replaceState(null, "", id === "all" ? location.pathname : `#${id}`); } catch {}
  renderList();
}

function buildTabs() {
  const tabs = [{ id: "all", name: "All" }, ...data.tabs];
  $("tabs").replaceChildren(...tabs.map(item => {
    const tab = Object.assign(document.createElement("button"), { className: "tab", type: "button", textContent: item.name });
    tab.dataset.id = item.id;
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-controls", "panel");
    tab.addEventListener("click", () => selectTab(item.id));
    return tab;
  }));
}

$("tabs").addEventListener("keydown", event => {
  const tabs = [...document.querySelectorAll(".tab")];
  const index = tabs.findIndex(tab => tab.dataset.id === active);
  const moves = { ArrowRight: index + 1, ArrowLeft: index - 1, Home: 0, End: tabs.length - 1 };
  if (!(event.key in moves)) return;
  event.preventDefault();
  selectTab(tabs[(moves[event.key] + tabs.length) % tabs.length].dataset.id, true);
});

fetch("data/feeds.json", { cache: "no-store" })
  .then(response => { if (!response.ok) throw new Error(); return response.json(); })
  .then(result => {
    data = result;
    $("updated").textContent = `Updated ${timeAgo(data.updatedAt).toLowerCase()}`;
    buildTabs();
    const wanted = location.hash.slice(1);
    selectTab(data.tabs.some(item => item.id === wanted) ? wanted : "all");
  })
  .catch(() => { $("updated").textContent = "The headlines couldn't be loaded. Reload the page to try again."; });
</script>
</body>
</html>
